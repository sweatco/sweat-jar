[package]
name = "sweat_jar"
version = "3.5.2"
authors = ["Sweat Economy"]
edition = "2021"
repository = "https://github.com/sweatco/sweat-jar"

[lib]
crate-type = ["cdylib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.93.0"
image_digest = "sha256:79b789c81ba19ec30794a6b1046b02dcaf5c055994b22cc7c9af67ab5096b095"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
]

[features]
default = ["release"]
release = ["sweat-jar-model/release-api"]

[dependencies]
ed25519-dalek = { workspace = true }
mutants = { workspace = true }

near-sdk = { workspace = true }
near-self-update-proc = { workspace = true }
near-contract-standards = { workspace = true }

sweat-jar-model = { workspace = true }

[dev-dependencies]
fake = { workspace = true }
rand = { workspace = true }
sha256 = { workspace = true }
base64 = { workspace = true }
anyhow = { workspace = true }
crypto-hash = { workspace = true }
itertools = { workspace = true }

# unit-testing pulls near-vm-runner/near-crypto (wasmtime, C-compiled
# secp256k1) — dev-only so the wasm build never needs a wasm32-capable
# C toolchain.
near-sdk = { workspace = true, features = ["unit-testing"] }
