[workspace]

resolver = "2"

default-members = ["contract"]
members = ["model", "contract"]

[workspace.dependencies]
anyhow = "1.0.75"
fake = "2.8.0"
rand = "0.8.5"
ed25519-dalek = { version = "2.0.0", features = ["rand_core"] }
base64 = "0.22.1"
sha256 = "1.3.0"
mutants = "0.0.3"
crypto-hash = "0.3.4"
itertools = "0.13"
strum = { version = "0.27", features = ["derive"] }

sweat-jar-model = { path = "model" }

near-self-update-proc = "0.1.2"

near-sdk = "5.28.3"
near-contract-standards = "5.28.3"
near-plugins = "0.5.3"
