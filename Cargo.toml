[workspace]

resolver = "2"

default-members = ["contract"]
members = ["primitives", "model", "contract", "replay"]

# The `replay` binary relies on `std::panic::catch_unwind` to turn a single
# user's contract panic into an `error:` CSV row instead of killing the run.
# `.cargo/config.toml` sets `panic = "abort"` on the release profile (for the
# contract wasm), which makes `catch_unwind` a no-op. Build `replay` with
# `--profile release-replay` to get an optimized *unwinding* binary.
[profile.release-replay]
inherits = "release"
panic = "unwind"

[workspace.dependencies]
anyhow = "1.0.75"
fake = "2.8.0"
rand = "0.8.5"
futures = "0.3.28"
num-format = "0.4.4"
ed25519-dalek = { version = "2.0.0", features = ["rand_core"] }
base64 = "0.22.0"
sha256 = "1.3.0"
mutants = "0.0.3"
sha2 = "0.10"
serde = "1.0"
visu = "0.2.4"
crypto-hash = "0.3.4"
itertools = "0.13"
tokio = { version = "1.37", features = ["full"] }
dirs = "5.0"
strum = { version = "0.27", features = ["derive"] }

sweat-jar-primitives = { path = "primitives" }
sweat-jar-model = { path = "model" }

near-sdk = "5.28.3"
near-contract-standards = "5.28.3"
near-plugins = "0.5.3"

primitive-types = { version = "0.10", default-features = false }

rstest = "0.25.0"
