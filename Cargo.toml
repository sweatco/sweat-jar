[workspace]

resolver = "2"

default-members = ["contract"]
members = ["primitives", "model", "contract"]

[workspace.dependencies]
anyhow = "1.0.75"
fake = "2.8.0"
rand = "0.8.5"
futures = "0.3.28"
num-format = "0.4.4"
ed25519-dalek = { version = "2.0.0", features = ["rand_core"] }
base64 = "0.22.0"
sha256 = "1.3.0"
mutants = "0.0.3"
sha2 = "0.10"
serde = "1.0"
visu = "0.2.4"
crypto-hash = "0.3.4"
itertools = "0.13"
tokio = { version = "1.37", features = ["full"] }
dirs = "5.0"
strum = { version = "0.27", features = ["derive"] }

sweat-jar-primitives = { path = "primitives" }
sweat-jar-model = { path = "model" }

near-self-update-proc = "0.1.2"

near-sdk = "5.28.3"
near-contract-standards = "5.28.3"
near-plugins = "0.5.3"

rstest = "0.25.0"
