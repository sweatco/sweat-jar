name: Install cargo-machete
description: Download the cargo-machete release binary and verify its checksum before installing.

runs:
  using: composite
  steps:
    - name: Download, verify and install cargo-machete
      shell: bash
      env:
        VERSION: 0.9.2
        SHA256: 48200087f54c55aabcd4db4af1e25742b49846c02a1b1bfa134711945b35b2e9
      run: |
        cd "$RUNNER_TEMP"
        curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o cargo-machete.tar.gz \
          "https://github.com/bnjbvr/cargo-machete/releases/download/v${VERSION}/cargo-machete-v${VERSION}-x86_64-unknown-linux-musl.tar.gz"
        echo "${SHA256}  cargo-machete.tar.gz" | sha256sum -c -
        tar -xzf cargo-machete.tar.gz
        install -m 755 "cargo-machete-v${VERSION}-x86_64-unknown-linux-musl/cargo-machete" "$HOME/.cargo/bin/cargo-machete"
        cargo machete --version
