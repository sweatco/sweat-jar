name: Push

on:
  push:
    branches: [main*]

env:
  CARGO_TERM_COLOR: always

jobs:
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1.21.0

  unused-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for unused dependencies
        run: |
          rustup install nightly
          cargo +nightly install cargo-machete --locked
          cargo machete

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: make lint

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.21.1/cargo-near-installer.sh | sh

      - name: Checkout
        uses: actions/checkout@v4

      - name: Actor
        run: echo ${{ github.actor }}

      - name: Build
        run: make build-reproducible

      - name: Upload binary
        uses: actions/upload-artifact@v3
        with:
          name: sweat-jar
          path: res/sweat_jar.wasm

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: make test

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-near CLI
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.21.1/cargo-near-installer.sh | sh

      - name: Integration tests
        run: make integration

  push:
    needs:
      [
        build,
        typos,
        unused-dependencies,
        lint,
        unit-tests,
        integration-tests,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
          fetch-depth: 0 # otherwise, you will failed to push refs to dest repo

      - name: Download binary
        uses: actions/download-artifact@v3
        with:
          name: sweat-jar
          path: res/

      - name: Commit & Push changes
        if: ${{ github.actor != 'sweatcoin' }}
        uses: actions-js/push@master
        with:
          message: Updated binary
          branch: main
          github_token: ${{ secrets.ACTIONS_TOKEN }}
