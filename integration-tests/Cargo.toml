[package]
name = "integration-tests"
version = "1.0.0"
publish = false
edition = "2021"

[dev-dependencies]
near-workspaces = "0.22"
anyhow = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sweat-jar-model = { path = "../model", features = ["testing"] }
# near-sdk 5.28's own build guard requires one of a fixed set of cfgs/features
# for any non-wasm32 build; sweat-jar-model (a transitive dep here, not the
# crate under `--test`) doesn't get `cfg(test)`, so this crate must directly
# request the guard's documented escape hatch for non-contract usage. Cargo's
# feature unification then activates it for the single resolved near-sdk
# instance shared with sweat-jar-model.
near-sdk = { version = "5.28.3", features = ["non-contract-usage"] }

# Empty `[workspace]` makes this crate its own workspace root, detached from the
# parent so it can use its own `rust-toolchain.toml` and dependency lock.
[workspace]
